name: Unit tests & coverage

# Reusable workflow — invoked by ci.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # coverageThreshold in jest.config.ts fails this step if coverage drops
      # below the gate, so a PR that lowers coverage fails CI here.
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
