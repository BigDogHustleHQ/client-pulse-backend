name: Integration tests (Cucumber)

# Reusable workflow — invoked by ci.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests (Cucumber)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Cucumber boots the real HTTP app with the Supabase boundary faked
      # in-memory, so no Redis/Postgres/storage services are needed.
      - run: npm run test:integration
