name: CI

# Orchestrator: runs on every PR and on pushes to main, delegating to one
# reusable workflow per concern (see ./lint.yml, ./test.yml, ./build.yml,
# ./integration.yml). The frontend-only legs from SID-62 (Storybook, Playwright,
# axe-core, Chromatic) don't apply to this NestJS backend.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so PRs don't pile up jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  test:
    uses: ./.github/workflows/test.yml
  build:
    uses: ./.github/workflows/build.yml
  integration:
    uses: ./.github/workflows/integration.yml
